<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon"> <!-- Favicon agregado -->
    <title>{% block title %}{% endblock %}</title>
    <style>
        /* Estilo personalizado para el navbar */
        .navbar-custom {
            background-color: #000000 !important; /* Fondo negro */
        }
        
        /* Estilo para la imagen del logo */
        .navbar-brand img {
            height: 34px; /* Tamaño ligeramente reducido para el logotipo */
            width: auto; /* Mantener proporción */
            max-height: 100%; /* No superar la altura del navbar */
        }
        
        /* Estilo para los botones del navbar */
        .btn-logout, .btn-outline-light {
            color: #fff;
            border-color: #fff;
            font-size: 0.75rem; /* Tamaño de fuente ligeramente más pequeño */
            padding: 0.25rem 0.5rem; /* Padding reducido */
        }
        .btn-logout:hover, .btn-outline-light:hover {
            background-color: #fff;
            color: #000;
        }

        /* Botones responsive: tamaño base reducido y ajustes para pantallas grandes */
        .btn-responsive { min-width: 0; padding: 0.4rem 0.8rem; font-size: 0.9rem; }
        @media (min-width: 992px) {
            .btn-responsive { padding: 0.6rem 1rem; font-size: 0.95rem; }
        }
        @media (max-width: 768px) {
            .btn-responsive {
                width: auto;
                display: inline-flex;
                justify-content: center;
                align-items: center;
                padding: 0.35rem 0.65rem;
                font-size: 0.85rem;
                min-width: 3.2rem;
            }
            .btn-responsive + .btn-responsive {
                margin-top: 0.25rem;
                margin-left: 0.4rem;
            }
            /* Mostrar icono y texto en pantallas pequeñas */
            .btn-responsive .btn-text { display: inline-block; margin-left: 0.25rem; font-size: 0.85rem; }
            .btn-responsive i { margin-right: 0.2rem; }
        }

        /* Estilos para los nav-links cuando actúan como botones */
        .btn-nav-link {
            color: #fff !important;
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            margin: 0 0.2rem;
            border: 1px solid #fff;
            border-radius: 0.25rem;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-block;
        }
        .btn-nav-link:hover {
            background-color: #fff;
            color: #000 !important;
        }

        /* Insignia circular de usuario dentro del botón */
        .user-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.15rem 0.4rem;
        }
        .user-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #fff;
            color: #000;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.6);
        }
        /* Mantener el texto en una sola línea y evitar que el círculo se comprima */
        .user-btn .user-text { white-space: nowrap; }
        /* Cambio de colores al pasar el ratón, coherente con los demás botones */
        .user-btn:hover .user-circle {
            background: #000;
            color: #fff;
            border-color: #fff;
        }

        /* Estilos para el dropdown del usuario (coherente con navbar oscuro) */
        .navbar .dropdown-menu {
            background-color: #000;
            border: 1px solid rgba(255,255,255,0.08);
            min-width: 200px;
            padding: 0.25rem 0;
        }
        .navbar .dropdown-item {
            color: #fff;
            padding: 0.5rem 1rem;
        }
        .navbar .dropdown-item:hover {
            background-color: rgba(255,255,255,0.06);
            color: #fff;
        }
        /* Ocultar la flecha/caret por diseño, el círculo ya indica interactivo */
        .dropdown-toggle::after { display: none; }

        /* Estilo para el botón hamburguesa */
        .navbar-toggler {
            border: 1px solid #fff;
            padding: 0.2rem 0.45rem;
        }
        .navbar-toggler:focus {
            box-shadow: none;
        }
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255, 255, 255, 1%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        /* Adaptación para pantallas pequeñas (solo afectando botones dentro del navbar) */
        @media (max-width: 576px) {
            .navbar .btn-logout, .navbar .btn-outline-light, .navbar .btn-nav-link {
                font-size: 0.8rem;
                padding: 0.35rem 0.6rem;
                margin: 0.1rem 0; /* Espaciado vertical en el menú colapsado */
                display: block; /* Los elementos se apilan verticalmente en el navbar colapsado */
                width: 100%; /* Ocupar todo el ancho disponible */
                text-align: left; /* Alinear texto a la izquierda */
            }
            .navbar-brand img {
                height: 28px; /* Reducir tamaño del logo */
            }
            .navbar-nav {
                padding-top: 0.5rem; /* Espaciado superior en el menú colapsado */
            }
            /* En pantallas muy pequeñas, mostrar solo el icono en botones responsivos
               pero mantener un tamaño mínimo legible (touch target ~44px) */
            .navbar .btn-responsive {
                display: inline-flex;
                justify-content: center;
                align-items: center;
                padding: 0.4rem;
                min-width: 40px;
                min-height: 40px;
                border-radius: 6px;
            }
            .navbar .btn-responsive .btn-text { display: none; }
            .navbar .btn-responsive i { font-size: 1.15rem; margin: 0; }
        }

        /* Asegurar que los nav-links estén alineados horizontalmente en pantallas grandes */
        @media (min-width: 577px) {
            .navbar-nav {
                display: flex;
                align-items: center; /* Alinear verticalmente */
                gap: 0.5rem; /* Espaciado entre botones */
            }
        }
    </style>
</head>
<body>
    <!-- Navbar con fondo negro -->
    <nav class="navbar navbar-expand-sm navbar-dark navbar-custom shadow-sm">
        <div class="container">
            <!-- Logo con imagen ajustada -->
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('menu')}}">
                <img src="{{ url_for('static', filename='logotipo.png') }}" alt="Financial Loans Logo" class="img-fluid">
            </a>
            
            <!-- Botón hamburguesa eliminado por petición: no mostrar el icono de 3 líneas -->
            
            <!-- Contenido colapsable del navbar -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto"> <!-- ms-auto empuja el contenido a la derecha -->
                    <!-- Aquí puedes agregar otros elementos del navbar que deban colapsar -->
                </div>
            </div>
            <!-- Botón de usuario fuera del collapsible para que siempre sea visible en móviles -->
            <div class="nav-item dropdown ms-auto">
                <a href="#" class="nav-link btn btn-outline-light btn-responsive dropdown-toggle d-flex align-items-center user-btn" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" title="Cuenta">
                    <span class="user-circle" aria-hidden="true">
                        {% if session.usuario %}
                            {{ session.usuario[0]|upper }}
                        {% else %}
                            <i class="fas fa-user"></i>
                        {% endif %}
                    </span>
                    <span class="btn-text ms-1 user-text">
                        {% if session.usuario %}
                            {{ session.usuario }}
                        {% else %}
                            Cuenta
                        {% endif %}
                    </span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end mt-2" aria-labelledby="userDropdown">
                    <li><a class="dropdown-item" href="{{ url_for('register') }}"><i class="fas fa-user-plus me-1"></i> Nuevo usuario</a></li>
                    <li><a class="dropdown-item" href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt me-1"></i> Cerrar sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <hr>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</body>
</html>
